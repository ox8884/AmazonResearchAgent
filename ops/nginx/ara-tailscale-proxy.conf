server {
    listen 127.0.0.1:3101;
    server_name hermes-vnic.tail6820dc.ts.net;
    client_max_body_size 25m;

    location / {
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name amazon-research-agent.hyj5317.workers.dev;
        proxy_set_header Host amazon-research-agent.hyj5317.workers.dev;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_set_header Authorization $http_authorization;
        proxy_pass https://amazon-research-agent.hyj5317.workers.dev;
    }
}
